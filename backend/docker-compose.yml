services:
  db:
    image: postgres:16
    container_name: osborne_motors_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osborne_motors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-osborne_motors_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osborne_motors} -d ${POSTGRES_DB:-osborne_motors_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: osborne_motors_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osborne_motors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-osborne_motors_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5188,http://127.0.0.1:5188,http://localhost:3000,http://127.0.0.1:3000}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      BASIN_FORM_ACTION: ${BASIN_FORM_ACTION:-}

    ports:
      - "127.0.0.1:8001:8000"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000"

volumes:
  pg_data:
    name: osborne_motors_pg_data
